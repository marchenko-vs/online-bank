services:
  nginx:
    image: byjg/nginx-extras:master
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx.crt:/usr/nginx.crt
      - ./nginx.key:/usr/nginx.key
      - ./static:/usr/static
      - ./README.md:/usr/README.md
    ports:
      - 10080:80
      - 10443:443
    depends_on:
      - backend-1
    networks:
      - app-network
  sql-server:
    container_name: sql-server
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "pass1234PASS"
    ports:
      - 11433:1433
    networks:
      - app-network
  backend-1:
    build: 
      context: ./src/backend/
      dockerfile: ./Dockerfile
    container_name: backend-1
    environment:
      ASPNETCORE_URLS: "http://*:5000;https://*:5001"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "pass1234PASS"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
    ports:
      - 15000:5000
      - 15001:5001
    volumes:
      - ./aspnetapp.pfx:/https/aspnetapp.pfx
    networks:
      - app-network
  frontend:
    build: 
      context: ./src/frontend/
      dockerfile: ./Dockerfile
    container_name: frontend
    ports:
      - 23000:3000
    networks:
      - app-network
  sqlpad:
    image: sqlpad/sqlpad:5
    hostname: 'sqlpad'
    container_name: dbadmin
    ports:
      - 13000:3000
    environment:
      SQLPAD_ADMIN: 'dykhal@mail.ru'
      SQLPAD_ADMIN_PASSWORD: 'admin'
      SQLPAD_APP_LOG_LEVEL: debug
      SQLPAD_WEB_LOG_LEVEL: warn
      SQLPAD_SEED_DATA_PATH: /etc/sqlpad/seed-data
      SQLPAD_CONNECTIONS__pgdemo__name: Postgres demo
      SQLPAD_CONNECTIONS__pgdemo__driver: postgres
      SQLPAD_CONNECTIONS__pgdemo__host: postgres
      SQLPAD_CONNECTIONS__pgdemo__database: sqlpad
      SQLPAD_CONNECTIONS__pgdemo__username: sqlpad
      SQLPAD_CONNECTIONS__pgdemo__password: sqlpad
      SQLPAD_CONNECTIONS__pgdemo__multiStatementTransactionEnabled: 'true'
      SQLPAD_CONNECTIONS__pgdemo__idleTimeoutSeconds: 86400
    networks:
      - app-network
networks:
  app-network:
    name: app_network
    driver: bridge
